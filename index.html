ng><p>${items[n].benefit}</p></div><span class="go">›</span></button>`).join('')}</div><button class="all" onclick="all()">전체 혜택 13가지 보기 ›</button>`}else if(mode==='swipe'){root.innerHTML=`<div class="rail">${items.map((i,n)=>`<div class="swipe">${glyph(i)}<h3>${i.name}</h3><p>${i.benefit}</p><button onclick="detail(items[${n}])">혜택 확인하기 ›</button></div>`).join('')}</div><div class="dots"><b>●</b> ● ● ● ● ●</div><button class="all" onclick="all()">전체 혜택 13가지 보기 ›</button>`}else{const groups=[['📣','고객을 더 모으고 싶어요','광고·홍보 혜택',[]],['🏪','운영을 더 편하게 하고 싶어요','배달·결제·학원관리',[0,1,3,4,5]],['💰','운영비를 아끼고 싶어요','청소·할인 혜택',[2]]];root.innerHTML=groups.map((g,k)=>`<div class="purpose"><button onclick="toggleGroup(${k})"><span class="purposeicon">${g[0]}</span><span class="copy"><strong>${g[1]}</strong><small>${g[2]}</small></span><span>⌄</span></button><div class="inside" id="group${k}" ${k===1?'':'hidden'}>${g[3].length?g[3].map(n=>`<button onclick="detail(items[${n}])"><span>${items[n].name} · ${items[n].benefit}</span><span>›</span></button>`).join(''):'<p style="font-size:12px;color:#888">카카오 광고지원금은 위 영역에서 확인할 수 있어요.</p>'}</div></div>`).join('')+`<button class="all" onclick="all()">전체 혜택 13가지 보기 ›</button>`}}function toggleGroup(k){let e=document.getElementById('group'+k);e.hidden=!e.hidden}switchMode('grid');</script></body></html>
